[package]
name = "body"
version = "0.2.2"
edition = "2021"
description = "Print header line(s) from STDIN untouched, then pipe the rest to another command. Unix only."
license = "MIT"
repository = "https://github.com/alanhoyle/body"
readme = "README.md"
keywords = ["cli", "header", "sort", "pipe"]
categories = ["command-line-utilities", "os::unix-apis"]

[[bin]]
name = "body"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
